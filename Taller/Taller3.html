<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Clientes</title>
    <!-- Conectamos el archivo de estilos CSS -->
    <link rel="stylesheet" href="Estilo3.css">
</head>
<body>

    <!-- Tarjeta principal del formulario -->
    <div class="contenedor-principal">
        <h2>Registro de Clientes</h2>
        
        <!-- Formulario con un identificador único -->
        <form id="formulario-cliente">
            
            <!-- Campo Cédula -->
            <div class="grupo-formulario">
                <label for="cedula">Cédula (10 dígitos):</label>
                <input type="text" id="cedula" maxlength="10" placeholder="Ej: 1712345678">
                <span class="texto-error" id="error-cedula"></span>
            </div>

            <!-- Campo Nombre -->
            <div class="grupo-formulario">
                <label for="nombre">Nombre (Máx. 30 caracteres):</label>
                <input type="text" id="nombre" maxlength="30" placeholder="Ej: Juan Pérez">
                <span class="texto-error" id="error-nombre"></span>
            </div>

            <!-- Campo Dirección -->
            <div class="grupo-formulario">
                <label for="direccion">Dirección (Máx. 50 caracteres):</label>
                <input type="text" id="direccion" maxlength="50" placeholder="Ej: Av. Principal y Calle Secundaria">
                <span class="texto-error" id="error-direccion"></span>
            </div>

            <!-- Campo Teléfono Celular -->
            <div class="grupo-formulario">
                <label for="telefono">Teléfono Celular (10 dígitos):</label>
                <input type="text" id="telefono" maxlength="10" placeholder="Ej: 0991234567">
                <span class="texto-error" id="error-telefono"></span>
            </div>

            <!-- Campo Correo Electrónico -->
            <div class="grupo-formulario">
                <label for="correo">Correo Electrónico:</label>
                <input type="email" id="correo" placeholder="Ej: correo@ejemplo.com">
                <span class="texto-error" id="error-correo"></span>
            </div>

            <!-- Botón para enviar -->
            <button type="submit" id="boton-enviar">Guardar Cliente</button>
        </form>

        <!-- Mensaje cuando todo sale bien -->
        <p id="mensaje-exito" class="alerta-exito" style="display: none;"></p>
    </div>

    <!-- Conectamos el archivo de lógica JavaScript -->
    <script src="Taller3.js"></script>
</body>
</html>
